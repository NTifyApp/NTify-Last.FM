plugins {
    id 'java'
}

group = 'com.spotifyxp.NTify-Last.FM'
version = '1.0-NIGHTLY'

repositories {
    mavenCentral()
}

dependencies {
    def dir = file("../NTify")
    def repo_jar_file = file("../NTify.jar")
    if (dir.exists() && dir.isDirectory()) {
        implementation files("${projectDir}/../NTify/target/NTify.jar")
    } else {
        if (repo_jar_file.exists() && !repo_jar_file.isDirectory()) {
            implementation files(repo_jar_file)
        }else {
            implementation files("${projectDir}/NTify/target/NTify.jar")
        }
    }
    implementation files("lastfm-java/target/lastfm-java-0.1.3-SNAPSHOT.jar")
}

task buildJar(type: Jar) {
    from configurations.runtimeClasspath.collect {
        it.name == 'NTify.jar' ? [] : (it.isDirectory() ? it : zipTree(it))
    }
    from sourceSets.main.output
    archiveFileName = 'NTify-Last.FM.jar'
}

build.dependsOn buildJar